<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCases · Генератор prizes.yml</title>
  <!-- Bootstrap 5.3 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Font Awesome 6.5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- js-yaml 4.1 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    body { background: #f4f6f9; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card-case { border-left: 5px solid #0d6efd; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05); transition: 0.2s; }
    .card-case:hover { box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,0.1); }
    .prize-item { background: #f8fafc; border-radius: 1rem; border: 1px solid #dee2e6; padding: 1.25rem; margin-bottom: 1rem; position: relative; }
    .subprize-item { background: #ffffff; border-radius: 0.75rem; border: 1px dashed #adb5bd; padding: 0.75rem; margin-top: 0.75rem; margin-left: 1.5rem; }
    .chance-sum-badge { font-size: 0.9rem; padding: 0.4rem 0.9rem; border-radius: 50px; font-weight: 500; }
    .btn-icon { padding: 0.25rem 0.6rem; }
    .stats-ok { background-color: #d1e7dd; color: #0a3622; border: 1px solid #a3cfbb; }
    .stats-warn { background-color: #fff3cd; color: #664d03; border: 1px solid #ffe69c; }
    .cmd-tag { background: #e9ecef; border-radius: 0.3rem; padding: 0.2rem 0.7rem; font-size: 0.85rem; font-family: monospace; cursor: pointer; transition: 0.1s; }
    .cmd-tag:hover { background: #ced4da; }
    .material-datalist { width: 100%; padding: 0.375rem 0.75rem; border: 1px solid #ced4da; border-radius: 0.375rem; }
    .accordion-button:not(.collapsed) { background-color: #e7f1ff; }
    .sub-toggle { font-size: 0.85rem; }
    textarea { font-family: 'Courier New', monospace; }
    .btn-copy-prize { position: absolute; top: 10px; right: 70px; } /* для кнопки копирования приза */
    .btn-delete-prize { position: absolute; top: 10px; right: 10px; }
    .prize-header { padding-right: 140px; } /* отступ под кнопки */
  </style>
</head>
<body class="pb-5">

<div class="container py-4">
  <!-- заголовок + панель управления -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <h2 class="mb-2 mb-sm-0"><i class="fas fa-cubes text-primary me-2"></i>BCases · prizes.yml · @staffmee</h2>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-success" id="loadFileBtn"><i class="fas fa-upload me-1"></i>Загрузить YAML</button>
      <input type="file" id="fileInput" accept=".yml,.yaml" style="display: none;">
      <button class="btn btn-outline-primary" id="previewBtn"><i class="fas fa-eye me-1"></i>Предпросмотр</button>
      <button class="btn btn-success" id="downloadBtn"><i class="fas fa-download me-1"></i>Скачать YAML</button>
      <button class="btn btn-outline-secondary" id="copyTextBtn"><i class="fas fa-copy me-1"></i>Копировать текстом</button>
    </div>
  </div>

  <!-- Кнопка добавить кейс -->
  <div class="mb-4">
    <button class="btn btn-primary" id="addCaseBtn"><i class="fas fa-plus-circle me-1"></i>Добавить кейс</button>
  </div>

  <!-- Контейнер для всех кейсов -->
  <div id="casesContainer"></div>
</div>

<!-- Модалка предпросмотра YAML -->
<div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-code me-2"></i>YAML предпросмотр</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <pre class="bg-light p-3 rounded" style="max-height: 60vh;" id="yamlPreview">— пусто —</pre>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        <button class="btn btn-primary" id="copyYamlBtn"><i class="fas fa-copy me-1"></i>Копировать</button>
      </div>
    </div>
  </div>
</div>

<!-- Шаблон для нового приза (скрыт) -->
<template id="prize-template">
  <div class="prize-item" data-prize-id="{prizeId}">
    <!-- Кнопки копирования и удаления вынесены в правый верхний угол -->
    <div class="prize-header">
      <div class="d-flex flex-wrap gap-2 align-items-start mb-2">
        <div class="flex-grow-1 d-flex flex-wrap gap-2 align-items-center">
          <input type="number" step="0.01" min="0.01" class="form-control form-control-sm prize-chance" style="width: 100px;" placeholder="Шанс" value="10.0">
          <div class="form-check form-switch">
            <input class="form-check-input prize-enchanted" type="checkbox" role="switch">
            <label class="form-check-label">зачар.</label>
          </div>
          <input type="text" class="form-control form-control-sm prize-material" list="materialList" placeholder="Материал" style="width: 140px;" value="stone">
          <input type="text" class="form-control form-control-sm prize-name" placeholder="Display name" style="width: 180px;" value="Приз">
        </div>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-outline-secondary toggle-sub"><i class="fas fa-layer-group"></i> подпризы</button>
        </div>
      </div>
    </div>
    <!-- Кнопки копирования и удаления (абсолютное позиционирование) -->
    <button class="btn btn-sm btn-outline-success copy-prize-btn" title="Копировать приз"><i class="fas fa-copy"></i></button>
    <button class="btn btn-sm btn-outline-danger delete-prize" title="Удалить приз"><i class="fas fa-trash-alt"></i></button>

    <!-- быстрые команды и textarea -->
    <div class="mb-2 d-flex flex-wrap gap-2 align-items-center">
      <select class="form-select form-select-sm cmd-select" style="width: 130px;">
        <option value="[MESSAGE] %player%">[MESSAGE]</option>
        <option value="[BROADCAST]">[BROADCAST]</option>
        <option value="[CONSOLE]">[CONSOLE]</option>
        <option value="[GIVE] %player% minecraft:stone 1">[GIVE]</option>
        <option value="[TITLE] %player% title">[TITLE]</option>
        <option value="[ACTION_BAR] %player% Привет">[ACTION_BAR]</option>
        <option value="[PLAY] minecraft:block.note_block.pling">[PLAY]</option>
        <option value="[TAKE_KEY] 1">[TAKE_KEY]</option>
      </select>
      <input type="text" class="form-control form-control-sm cmd-arg" placeholder="Аргументы / плейсхолдеры" style="width: 240px;" value="%player%">
      <button class="btn btn-sm btn-outline-primary add-cmd-btn"><i class="fas fa-plus"></i> Добавить команду</button>
    </div>
    <textarea class="form-control form-control-sm prize-commands" rows="2" placeholder="Список команд (одна на строку)">[MESSAGE] %player% Спасибо!</textarea>

    <!-- контейнер для подпризов -->
    <div class="subprizes-container mt-2" style="display: none;"></div>
  </div>
</template>

<!-- datalist материалов -->
<datalist id="materialList">
  <option value="stone"><option value="diamond"><option value="iron_ingot"><option value="gold_ingot"><option value="emerald">
  <option value="diamond_sword"><option value="bow"><option value="arrow"><option value="apple"><option value="bread">
  <option value="iron_chestplate"><option value="golden_apple"><option value="ender_pearl"><option value="blaze_rod">
  <option value="potion"><option value="experience_bottle"><option value="tnt"><option value="obsidian"><option value="cobblestone">
  <option value="oak_log"><option value="spruce_planks"><option value="netherite_ingot"><option value="nether_star">
  <option value="saddle"><option value="name_tag"><option value="book"><option value="paper"><option value="stick">
  <option value="coal"><option value="redstone"><option value="lapis_lazuli"><option value="ender_chest">
</datalist>

<script>
  (function() {
    // --- глобальные переменные ---
    let caseCounter = 1;            // для генерации уникальных ID
    const casesContainer = document.getElementById('casesContainer');
    const template = document.getElementById('prize-template').innerHTML;
    let modalInstance = null;

    // инициализация модалки Bootstrap
    document.addEventListener('DOMContentLoaded', function() {
      modalInstance = new bootstrap.Modal(document.getElementById('previewModal'));
    });

    // --- вспомогательные функции: генерация ID, сбор данных, сохранение/загрузка localStorage ---
    function generateCaseId() { return `case-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`; }
    function generatePrizeId() { return `prize-${Date.now()}-${Math.random().toString(36).substr(2, 8)}`; }

    // сохранить всё в localStorage
    function saveToLocalStorage() {
      try {
        const data = collectCasesData();  // собираем UI данные
        localStorage.setItem('bcases_prizes_ui', JSON.stringify(data));
      } catch (e) { console.warn('save error', e); }
    }

    // восстановить из localStorage (вызывается при старте)
    function restoreFromLocalStorage() {
      const saved = localStorage.getItem('bcases_prizes_ui');
      if (!saved) return false;
      try {
        const casesData = JSON.parse(saved);
        // очищаем контейнер
        casesContainer.innerHTML = '';
        caseCounter = 1;
        casesData.forEach(c => {
          addCaseToUI(c.caseName, c.prizes);
        });
        return true;
      } catch (e) { console.warn('restore error', e); return false; }
    }

    // --- сбор данных из UI (для экспорта в YAML и сохранения) ---
    function collectCasesData() {
      const caseCards = document.querySelectorAll('.case-card');
      const cases = [];
      for (let card of caseCards) {
        const caseId = card.dataset.caseId;
        const caseNameInput = card.querySelector('.case-name-input');
        if (!caseNameInput) continue;
        const caseName = caseNameInput.value.trim() || 'unnamed';
        const prizes = collectPrizesFromContainer(card.querySelector('.prizes-container'));
        cases.push({ caseName, prizes });
      }
      return cases;
    }

    // сбор призов из контейнера (рекурсивно обрабатывает подпризы)
    function collectPrizesFromContainer(container) {
      const prizes = [];
      const prizeDivs = container.querySelectorAll(':scope > .prize-item');
      for (let pDiv of prizeDivs) {
        const chance = parseFloat(pDiv.querySelector('.prize-chance')?.value) || 0;
        const enchanted = pDiv.querySelector('.prize-enchanted')?.checked || false;
        const material = pDiv.querySelector('.prize-material')?.value || 'stone';
        const displayName = pDiv.querySelector('.prize-name')?.value || '';
        const commands = pDiv.querySelector('.prize-commands')?.value.split('\n').filter(c => c.trim() !== '') || [];

        const prize = { chance, enchanted, material, display_name: displayName, give_commands: commands };
        // подпризы
        const subContainer = pDiv.querySelector('.subprizes-container');
        if (subContainer && subContainer.style.display !== 'none') {
          const subPrizes = collectPrizesFromContainer(subContainer);
          if (subPrizes.length) prize.items = subPrizes;
        }
        prizes.push(prize);
      }
      return prizes;
    }

    // --- добавление нового кейса в UI (опционально с предзаполненными призами) ---
    function addCaseToUI(caseName = 'Новый кейс', prizesData = []) {
      const caseId = generateCaseId();
      const caseDiv = document.createElement('div');
      caseDiv.className = 'card card-case mb-4 case-card';
      caseDiv.dataset.caseId = caseId;
      caseDiv.innerHTML = `
        <div class="card-header bg-white d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div class="d-flex flex-wrap align-items-center gap-3">
            <input type="text" class="form-control form-control-sm case-name-input" style="width: 220px;" value="${escapeHtml(caseName)}" placeholder="Имя кейса">
            <span class="chance-sum-badge bg-light border" id="sum-${caseId}"><i class="fas fa-percent me-1"></i>сумма: 0.0</span>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary add-prize-btn" title="Добавить приз"><i class="fas fa-gift me-1"></i>Приз</button>
            <button class="btn btn-sm btn-outline-danger delete-case"><i class="fas fa-times-circle"></i></button>
          </div>
        </div>
        <div class="card-body">
          <div class="prizes-container"></div>
        </div>
      `;
      casesContainer.appendChild(caseDiv);

      // добавить призы, если переданы
      const prizesContainer = caseDiv.querySelector('.prizes-container');
      if (prizesData && prizesData.length) {
        prizesData.forEach(p => addPrizeToContainer(prizesContainer, p));
      }

      // пересчёт суммы шансов при изменении
      updateChanceSum(caseId);
      caseDiv.addEventListener('input', (e) => {
        if (e.target.classList.contains('prize-chance')) updateChanceSum(caseId);
      });

      // автосохранение после изменений
      caseDiv.addEventListener('input', () => saveToLocalStorage());
      caseDiv.addEventListener('change', () => saveToLocalStorage());

      // кнопка добавить приз в этом кейсе
      caseDiv.querySelector('.add-prize-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        addPrizeToContainer(prizesContainer, null);
        updateChanceSum(caseId);
        saveToLocalStorage();
      });

      // удаление кейса
      caseDiv.querySelector('.delete-case').addEventListener('click', () => {
        caseDiv.remove();
        saveToLocalStorage();
      });

      // переименование — сохраняем
      caseDiv.querySelector('.case-name-input').addEventListener('change', saveToLocalStorage);
      return caseDiv;
    }

    // функция глубокого копирования приза (со всеми подпризами)
    function copyPrizeDeep(prizeDiv) {
      // собираем данные исходного приза
      const chance = prizeDiv.querySelector('.prize-chance').value;
      const enchanted = prizeDiv.querySelector('.prize-enchanted').checked;
      const material = prizeDiv.querySelector('.prize-material').value;
      const displayName = prizeDiv.querySelector('.prize-name').value;
      const commands = prizeDiv.querySelector('.prize-commands').value;

      // подпризы
      const subContainer = prizeDiv.querySelector('.subprizes-container');
      const subPrizes = [];
      if (subContainer && subContainer.style.display !== 'none') {
        const subItems = subContainer.querySelectorAll(':scope > .prize-item');
        subItems.forEach(subDiv => {
          subPrizes.push(extractPrizeData(subDiv));
        });
      }

      // создаём структуру данных
      const prizeData = {
        chance: parseFloat(chance),
        enchanted: enchanted,
        material: material,
        display_name: displayName,
        give_commands: commands.split('\n').filter(c => c.trim() !== '')
      };
      if (subPrizes.length) prizeData.items = subPrizes;

      return prizeData;
    }

    // извлечение данных из prizeDiv (рекурсивно)
    function extractPrizeData(prizeDiv) {
      const chance = prizeDiv.querySelector('.prize-chance').value;
      const enchanted = prizeDiv.querySelector('.prize-enchanted').checked;
      const material = prizeDiv.querySelector('.prize-material').value;
      const displayName = prizeDiv.querySelector('.prize-name').value;
      const commands = prizeDiv.querySelector('.prize-commands').value;

      const subContainer = prizeDiv.querySelector('.subprizes-container');
      const subPrizes = [];
      if (subContainer && subContainer.style.display !== 'none') {
        const subItems = subContainer.querySelectorAll(':scope > .prize-item');
        subItems.forEach(subDiv => {
          subPrizes.push(extractPrizeData(subDiv));
        });
      }

      const prize = {
        chance: parseFloat(chance),
        enchanted: enchanted,
        material: material,
        display_name: displayName,
        give_commands: commands.split('\n').filter(c => c.trim() !== '')
      };
      if (subPrizes.length) prize.items = subPrizes;
      return prize;
    }

    // добавить приз в контейнер (prizesContainer) с рекурсивным заполнением если переданы данные
    function addPrizeToContainer(container, prizeData = null) {
      const prizeId = generatePrizeId();
      let html = template.replace(/{prizeId}/g, prizeId);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      const prizeDiv = tempDiv.firstElementChild;

      // если есть prizeData — заполнить поля
      if (prizeData) {
        prizeDiv.querySelector('.prize-chance').value = prizeData.chance || 0;
        prizeDiv.querySelector('.prize-enchanted').checked = prizeData.enchanted || false;
        prizeDiv.querySelector('.prize-material').value = prizeData.material || 'stone';
        prizeDiv.querySelector('.prize-name').value = prizeData.display_name || '';
        if (prizeData.give_commands && Array.isArray(prizeData.give_commands)) {
          prizeDiv.querySelector('.prize-commands').value = prizeData.give_commands.join('\n');
        }
        // если есть подпризы (items) — добавляем их в скрытый контейнер, но показываем его
        if (prizeData.items && prizeData.items.length) {
          const subContainer = prizeDiv.querySelector('.subprizes-container');
          subContainer.style.display = 'block';  // сделаем видимым сразу
          // меняем текст кнопки
          prizeDiv.querySelector('.toggle-sub').innerHTML = '<i class="fas fa-layer-group"></i> скрыть';
          prizeData.items.forEach(sub => addPrizeToContainer(subContainer, sub));
        }
      }

      container.appendChild(prizeDiv);

      // --- обработчики для приза ---
      // кнопка удалить приз
      prizeDiv.querySelector('.delete-prize').addEventListener('click', () => {
        prizeDiv.remove();
        // обновить сумму в родительском кейсе
        const caseCard = prizeDiv.closest('.case-card');
        if (caseCard) updateChanceSum(caseCard.dataset.caseId);
        saveToLocalStorage();
      });

      // кнопка копировать приз
      prizeDiv.querySelector('.copy-prize-btn').addEventListener('click', () => {
        const prizeData = extractPrizeData(prizeDiv);
        // добавляем копию в тот же контейнер
        addPrizeToContainer(container, prizeData);
        // обновить сумму
        const caseCard = prizeDiv.closest('.case-card');
        if (caseCard) updateChanceSum(caseCard.dataset.caseId);
        saveToLocalStorage();
      });

      // кнопка показать/скрыть подпризы
      const toggleBtn = prizeDiv.querySelector('.toggle-sub');
      const subContainer = prizeDiv.querySelector('.subprizes-container');
      toggleBtn.addEventListener('click', () => {
        if (subContainer.style.display === 'none') {
          subContainer.style.display = 'block';
          toggleBtn.innerHTML = '<i class="fas fa-layer-group"></i> скрыть';
        } else {
          subContainer.style.display = 'none';
          toggleBtn.innerHTML = '<i class="fas fa-layer-group"></i> подпризы';
        }
        saveToLocalStorage();
      });

      // добавление команды через быстрый выбор
      const addCmdBtn = prizeDiv.querySelector('.add-cmd-btn');
      const cmdSelect = prizeDiv.querySelector('.cmd-select');
      const cmdArg = prizeDiv.querySelector('.cmd-arg');
      const cmdTextarea = prizeDiv.querySelector('.prize-commands');
      addCmdBtn.addEventListener('click', () => {
        let baseCmd = cmdSelect.value;
        // если есть аргумент и в команде есть символ % (placeholder) — заменяем? обычно просто приклеиваем
        if (cmdArg.value.trim() !== '' && !baseCmd.includes('%player%')) {
          // для GIVE и подобных используем аргумент как доп
          if (baseCmd.startsWith('[GIVE]')) {
            baseCmd = '[GIVE] ' + cmdArg.value.trim() + ' minecraft:stone 1';
          } else if (baseCmd.startsWith('[MESSAGE]')) {
            baseCmd = '[MESSAGE] ' + cmdArg.value.trim();
          } else {
            baseCmd = baseCmd + ' ' + cmdArg.value.trim();
          }
        } else if (baseCmd.includes('%player%') && cmdArg.value.trim()) {
          baseCmd = baseCmd.replace('%player%', cmdArg.value.trim());
        }
        // вставить в textarea (с новой строки)
        const current = cmdTextarea.value;
        cmdTextarea.value = current ? current + '\n' + baseCmd : baseCmd;
        saveToLocalStorage();
      });

      // все изменения сохраняем
      prizeDiv.addEventListener('input', () => {
        const caseCard = prizeDiv.closest('.case-card');
        if (caseCard) updateChanceSum(caseCard.dataset.caseId);
        saveToLocalStorage();
      });
      prizeDiv.addEventListener('change', saveToLocalStorage);

      // Кнопка добавления подприза (если ещё нет)
      if (!subContainer.querySelector('.add-subprize-btn')) {
        const addSubBtn = document.createElement('button');
        addSubBtn.className = 'btn btn-sm btn-outline-secondary mt-2 add-subprize-btn';
        addSubBtn.innerHTML = '<i class="fas fa-plus-circle"></i> добавить подприз';
        subContainer.appendChild(addSubBtn);
        addSubBtn.addEventListener('click', () => {
          addPrizeToContainer(subContainer, null);
          // обновить сумму выше? сумма подпризов не участвует в основной сумме, но мы обновим родительскую сумму шансов (она не меняется)
          const caseCard = prizeDiv.closest('.case-card');
          if (caseCard) updateChanceSum(caseCard.dataset.caseId);
          saveToLocalStorage();
        });
      }
    }

    // обновление суммы шансов для конкретного кейса
    function updateChanceSum(caseId) {
      const caseCard = document.querySelector(`.case-card[data-case-id="${caseId}"]`);
      if (!caseCard) return;
      const sumSpan = document.getElementById(`sum-${caseId}`);
      if (!sumSpan) return;
      const chanceInputs = caseCard.querySelectorAll('.prizes-container > .prize-item .prize-chance');
      let total = 0;
      chanceInputs.forEach(inp => { total += parseFloat(inp.value) || 0; });
      sumSpan.innerHTML = `<i class="fas fa-percent me-1"></i>сумма: ${total.toFixed(2)}`;
      // изменить класс в зависимости от 100 ± tiny
      if (Math.abs(total - 100) < 0.01) {
        sumSpan.className = 'chance-sum-badge stats-ok';
      } else {
        sumSpan.className = 'chance-sum-badge stats-warn';
      }
    }

    // --- утилита экранирования ---
    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;';
        return m;
      });
    }

    // --- загрузка YAML и заполнение интерфейса ---
    function loadYamlAndRender(content) {
      try {
        const parsed = jsyaml.load(content);
        if (!parsed || typeof parsed !== 'object') throw new Error('Невалидный YAML (не объект)');
        let casesArray = [];
        if (Array.isArray(parsed)) {
          casesArray = parsed;
        } else {
          throw new Error('Корневой элемент должен быть массивом кейсов');
        }

        // очистить UI
        casesContainer.innerHTML = '';
        caseCounter = 1;
        casesArray.forEach(item => {
          let caseName = item.name || item.caseName || 'Кейс';
          let prizes = item.prizes || item.items || [];
          addCaseToUI(caseName, prizes);
        });
        saveToLocalStorage();
      } catch (e) {
        alert('Ошибка парсинга YAML: ' + e.message);
      }
    }

    // --- предпросмотр YAML (модалка) ---
    function showPreview() {
      const cases = collectCasesData();
      // преобразуем в массив под формат prizes.yml (как в примере)
      const yamlData = cases.map(c => ({
        name: c.caseName,
        prizes: c.prizes
      }));
      try {
        const yamlText = jsyaml.dump(yamlData, { indent: 2, lineWidth: -1 });
        document.getElementById('yamlPreview').textContent = yamlText || '— пусто —';
        modalInstance.show();
      } catch (e) {
        alert('Ошибка генерации YAML: ' + e);
      }
    }

    // --- копировать текстом (YAML в буфер обмена) ---
    function copyYamlToClipboard() {
      const cases = collectCasesData();
      const yamlData = cases.map(c => ({ name: c.caseName, prizes: c.prizes }));
      try {
        const yamlStr = jsyaml.dump(yamlData, { indent: 2, lineWidth: -1 });
        navigator.clipboard.writeText(yamlStr).then(() => {
          alert('YAML скопирован в буфер обмена');
        }).catch(() => {
          alert('Не удалось скопировать, используйте предпросмотр');
        });
      } catch (e) {
        alert('Ошибка формирования YAML: ' + e);
      }
    }

    // --- инициализация ---
    function init() {
      // пробуем восстановить из localStorage
      const restored = restoreFromLocalStorage();
      if (!restored) {
        // создать один демо-кейс по умолчанию
        addCaseToUI('Пример кейса', [
          { chance: 50, enchanted: true, material: 'diamond', display_name: '&bАлмаз', give_commands: ['[MESSAGE] &aВы выиграли алмаз!', '[CONSOLE] say Игрок %player% получил алмаз'] },
          { chance: 50, enchanted: false, material: 'stone', display_name: 'Булыжник', give_commands: ['[GIVE] %player% minecraft:cobblestone 64'] }
        ]);
      }

      // --- обработчики кнопок ---
      document.getElementById('addCaseBtn').addEventListener('click', () => {
        addCaseToUI('Новый кейс', []);
        saveToLocalStorage();
      });

      document.getElementById('downloadBtn').addEventListener('click', () => {
        const cases = collectCasesData();
        const yamlData = cases.map(c => ({ name: c.caseName, prizes: c.prizes }));
        try {
          const yamlStr = jsyaml.dump(yamlData, { indent: 2, lineWidth: -1 });
          const blob = new Blob([yamlStr], { type: 'text/yaml' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'prizes.yml'; a.click();
          URL.revokeObjectURL(url);
        } catch (e) { alert('Ошибка: ' + e); }
      });

      document.getElementById('previewBtn').addEventListener('click', showPreview);

      document.getElementById('copyTextBtn').addEventListener('click', copyYamlToClipboard);

      document.getElementById('loadFileBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });

      document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          loadYamlAndRender(ev.target.result);
        };
        reader.readAsText(file);
        e.target.value = ''; // сброс
      });

      document.getElementById('copyYamlBtn').addEventListener('click', () => {
        const text = document.getElementById('yamlPreview').textContent;
        navigator.clipboard?.writeText(text).then(() => alert('Скопировано!')).catch(() => alert('Не удалось скопировать'));
      });

      // глобальное автосохранение по событиям (подстраховка)
      document.addEventListener('input', saveToLocalStorage);
      document.addEventListener('change', saveToLocalStorage);
    }

    init();
  })();
</script>
