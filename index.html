<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCases Prizes Generator/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; }
        .case-section { border: 1px solid #dee2e6; border-radius: 10px; margin-bottom: 25px; padding: 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .prize-item { border: 1px solid #e9ecef; border-radius: 8px; margin-bottom: 15px; padding: 15px; background: #f8f9fa; }
        .subprize-item { margin-left: 25px; border-left: 4px solid #0d6efd; background: #e7f1ff; padding: 12px; border-radius: 6px; margin-top: 10px; }
        .cmd-list { min-height: 90px; font-family: 'Courier New', Courier, monospace; font-size: 0.95em; }
        .preview { background: #1e293b; color: #e2e8f0; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; max-height: 500px; overflow-y: auto; }
        .stats { background: #d1fae5; padding: 10px; border-radius: 6px; margin-top: 12px; font-weight: 500; }
        .file-input { display: none; }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="text-center mb-5">
            <h1><i class="fas fa-rocket me-3 text-primary"></i>BCases Editor</h1>
            <p class="text-muted lead">by @staffmee</p>
        </div>

        <div class="d-flex flex-wrap gap-3 justify-content-center mb-4">
            <button class="btn btn-primary btn-lg" onclick="addCase()">
                <i class="fas fa-plus me-2"></i>Добавить кейс
            </button>
            <label class="btn btn-outline-success btn-lg mb-0" for="load-yaml">
                <i class="fas fa-upload me-2"></i>Загрузить файл
            </label>
            <input type="file" id="load-yaml" class="file-input" accept=".yml,.yaml" onchange="loadYaml(event)">
            <button class="btn btn-success btn-lg" onclick="downloadYaml()">
                <i class="fas fa-download me-2"></i>Скачать .yml
            </button>
            <button class="btn btn-info btn-lg" onclick="showPreview()">
                <i class="fas fa-eye me-2"></i>Предпросмотр
            </button>
            <button class="btn btn-danger btn-lg" onclick="clearAllData()">
                <i class="fas fa-trash-alt"></i> Очистить всё
            </button>
        </div>

        <div id="cases-container"></div>

        <div class="modal fade" id="preview-modal" tabindex="-1">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Предпросмотр prizes.yml</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="yaml-preview" class="preview"></div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                        <button class="btn btn-success" onclick="downloadYaml()">Скачать</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <datalist id="materials-list">
        <option value="stone"><option value="diamond"><option value="netherite_ingot"><option value="elytra">
    </datalist>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cases = {}; 
        const STORAGE_KEY = 'bcases_autosave';

        const cmdPlaceholders = {
            '[MESSAGE]': '&fВы выиграли приз!',
            '[BROADCAST]': '&6%player% выиграл!',
            '[CONSOLE]': 'give %player% diamond 1',
            '[GIVE]': 'diamond_sword 1',
            '[TAKE_KEY]': 'default'
        };

        // --- CORE FUNCTIONS ---

        function saveToLocalStorage() {
            const data = collectData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    renderAll(parsed);
                } catch (e) { console.error("Ошибка загрузки автосохранения", e); }
            } else {
                addCase('default');
            }
        }

        function renderAll(data) {
            document.getElementById('cases-container').innerHTML = '';
            cases = {};
            if (data.prizes) {
                Object.entries(data.prizes).forEach(([name, prizes]) => {
                    const caseId = addCase(name, false);
                    prizes.forEach(p => addPrize(caseId, p, false));
                });
            }
        }

        function addCase(caseName = null, shouldSave = true) {
            const container = document.getElementById('cases-container');
            const id = caseName || `case_${Date.now()}`;
            cases[id] = [];

            const html = `
                <div class="case-section" data-case="${id}">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3><i class="fas fa-box me-2 text-primary"></i>Кейс: 
                            <input type="text" class="form-control d-inline-block w-auto ms-2 case-name-input" 
                                   value="${id}" onchange="updateCaseId('${id}', this.value)">
                        </h3>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeCase('${id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="prizes-list" id="prizes-${id}"></div>
                    <button class="btn btn-outline-primary mt-2" onclick="addPrize('${id}')">
                        <i class="fas fa-plus me-1"></i>Добавить приз
                    </button>
                    <div class="stats" id="stats-${id}"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            updateStats(id);
            if(shouldSave) saveToLocalStorage();
            return id;
        }

        function updateCaseId(oldId, newId) {
            newId = newId.trim();
            if (!newId || (cases[newId] && oldId !== newId)) {
                alert('ID занят или пуст!');
                document.querySelector(`[data-case="${oldId}"] .case-name-input`).value = oldId;
                return;
            }
            
            // Переносим данные в объекте
            cases[newId] = cases[oldId];
            delete cases[oldId];

            // Обновляем DOM и атрибуты, чтобы функции удаления/добавления не ломались
            const section = document.querySelector(`[data-case="${oldId}"]`);
            section.dataset.case = newId;
            section.querySelector(`#prizes-${oldId}`).id = `prizes-${newId}`;
            section.querySelector(`#stats-${oldId}`).id = `stats-${newId}`;
            
            // Перезаписываем onclick события у кнопок внутри этой секции
            const buttons = section.querySelectorAll('button[onclick]');
            buttons.forEach(btn => {
                let attr = btn.getAttribute('onclick');
                btn.setAttribute('onclick', attr.replace(new RegExp(`'${oldId}'`, 'g'), `'${newId}'`));
            });

            // Перезаписываем oninput у инпутов
            const inputs = section.querySelectorAll('[oninput], [onchange]');
            inputs.forEach(el => {
                ['oninput', 'onchange'].forEach(evt => {
                    let attr = el.getAttribute(evt);
                    if(attr) el.setAttribute(evt, attr.replace(new RegExp(`'${oldId}'`, 'g'), `'${newId}'`));
                });
            });

            updateStats(newId);
            saveToLocalStorage();
        }

        function addPrize(caseId, data = {}, shouldSave = true) {
            const container = document.getElementById(`prizes-${caseId}`);
            const pId = `p${Date.now()}${Math.floor(Math.random()*1000)}`;
            
            const prize = {
                _id: pId,
                chance: data.chance ?? 100,
                enchanted: !!data.enchanted,
                material: data.material || 'stone',
                display_name: data.display_name || '&7Приз',
                give_commands: data.give_commands || [],
                items: data.items || []
            };
            cases[caseId].push(prize);

            const html = `
                <div class="prize-item" data-prize="${pId}">
                    <div class="d-flex justify-content-between mb-3">
                        <h5><i class="fas fa-gift me-2 text-success"></i>Приз</h5>
                        <button class="btn btn-sm btn-outline-danger" onclick="removePrize('${caseId}', '${pId}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-2">
                            <label>Шанс</label>
                            <input type="number" class="form-control" value="${prize.chance}" oninput="updatePrize('${caseId}', '${pId}', 'chance', this.value)">
                        </div>
                        <div class="col-md-2 text-center">
                            <label>Glow</label><br>
                            <input type="checkbox" class="form-check-input" ${prize.enchanted?'checked':''} oninput="updatePrize('${caseId}', '${pId}', 'enchanted', this.checked)">
                        </div>
                        <div class="col-md-4">
                            <label>ID Материала</label>
                            <input type="text" class="form-control" list="materials-list" value="${prize.material}" oninput="updatePrize('${caseId}', '${pId}', 'material', this.value)">
                        </div>
                        <div class="col-md-4">
                            <label>Имя в меню</label>
                            <input type="text" class="form-control" value="${prize.display_name}" oninput="updatePrize('${caseId}', '${pId}', 'display_name', this.value)">
                        </div>
                    </div>
                    <div class="mt-3">
                        <label>Команды</label>
                        <textarea class="form-control cmd-list" oninput="updateCmds('${caseId}', '${pId}', this.value)">${prize.give_commands.join('\n')}</textarea>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            updateStats(caseId);
            if(shouldSave) saveToLocalStorage();
        }

        function updatePrize(caseId, pId, key, val) {
            const p = cases[caseId].find(x => x._id === pId);
            if(p) {
                p[key] = (key === 'chance') ? parseFloat(val) : val;
                if(key === 'chance') updateStats(caseId);
                saveToLocalStorage();
            }
        }

        function updateCmds(caseId, pId, val) {
            const p = cases[caseId].find(x => x._id === pId);
            if(p) {
                p.give_commands = val.split('\n').map(c => c.trim()).filter(c => c);
                saveToLocalStorage();
            }
        }

        function removeCase(id) {
            if(!confirm('Удалить кейс?')) return;
            delete cases[id];
            document.querySelector(`[data-case="${id}"]`).remove();
            saveToLocalStorage();
        }

        function removePrize(caseId, pId) {
            cases[caseId] = cases[caseId].filter(x => x._id !== pId);
            document.querySelector(`[data-prize="${pId}"]`).remove();
            updateStats(caseId);
            saveToLocalStorage();
        }

        function updateStats(caseId) {
            const total = cases[caseId].reduce((s, p) => s + (p.chance || 0), 0);
            document.getElementById(`stats-${caseId}`).innerHTML = `Сумма шансов: <b>${total.toFixed(2)}%</b>`;
        }

        function collectData() {
            const out = { prizes: {} };
            for (let name in cases) {
                out.prizes[name] = cases[name].map(p => {
                    const { _id, ...clean } = p;
                    return clean;
                });
            }
            return out;
        }

        function showPreview() {
            const yaml = jsyaml.dump(collectData(), { indent: 2, lineWidth: -1 });
            document.getElementById('yaml-preview').textContent = yaml;
            new bootstrap.Modal('#preview-modal').show();
        }

        function downloadYaml() {
            const yaml = jsyaml.dump(collectData(), { indent: 2, lineWidth: -1 });
            const blob = new Blob([yaml], { type: 'text/yaml' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'prizes.yml';
            a.click();
        }

        function loadYaml(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = jsyaml.load(e.target.result);
                    renderAll(parsed);
                    saveToLocalStorage();
                } catch(err) { alert("Ошибка файла!"); }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if(confirm('Это удалит ВСЕ данные из браузера. Уверены?')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        document.addEventListener('DOMContentLoaded', loadFromLocalStorage);
    </script>
</body>
</html>
